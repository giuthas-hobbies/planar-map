[project]
name = "planar-map"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pertti Palo", email = "giuthas@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.2",
    "pyqt6>=6.11.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
planar-map = "planar_map:run_cli"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "myst-parser>=5.0.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.10.2",
    "sphinx-rtd-theme>=3.1.0",
]
